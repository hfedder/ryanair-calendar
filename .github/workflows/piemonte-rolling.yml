name: Piemonte rolling rail calendar

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish only if all twelve months pass coverage checks'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '20 5 * * *'

permissions:
  contents: write

concurrency:
  group: piemonte-rolling-rail
  cancel-in-progress: false

jobs:
  rail:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build rolling rail candidate
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'true' || 'false' }}
        run: |
          if [ "$PUBLISH" = 'true' ]; then
            python -u piemonte_rolling_rail.py --publish
          else
            python -u piemonte_rolling_rail.py
          fi
      - name: Upload validation and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piemonte-rolling-test
          path: |
            piemonte_rolling_validation.json
            Piemonte_tog_rolling_candidate.ics
          if-no-files-found: warn
      - name: Commit published calendar only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          test -s Piemonte_tog_rolling.ics
          git config user.name 'Piemonte Calendar Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Piemonte_tog_rolling.ics
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated rolling Piemonte rail calendar'
            git push
          fi
