name: Test Ryanair MCP

on:
  workflow_dispatch:

jobs:
  test-mcp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Ryanair MCP connection
        run: python probe_ryanair_mcp.py
