name: Test Ryanair December 2026

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-december:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test December 2026 flights
        run: python test_ryanair_december_2026.py
