name: Update Ryanair calendar

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update Ryanair calendar in safe mode
        run: python update_ryanair_calendar.py
        env:
          PUBLISH_CALENDAR: "false"

      - name: Check candidate calendar and report
        run: |
          test -s Ryanair_TRN_BGY_CPH_candidate.ics
          test -s ryanair_validation_report.json

          echo "Candidate calendar exists and is not empty"
          echo "Number of candidate events:"
          grep -c "BEGIN:VEVENT" Ryanair_TRN_BGY_CPH_candidate.ics

          echo "Validation report:"
          cat ryanair_validation_report.json

      - name: Commit validation files
        run: |
          git config user.name "Ryanair Calendar Bot"
          git config user.email "actions@users.noreply.github.com"

          git add Ryanair_TRN_BGY_CPH_candidate.ics
          git add ryanair_validation_report.json

          if git diff --cached --quiet; then
            echo "No candidate changes found"
          else
            git commit -m "Validate Ryanair all-flights candidate"
            git push
          fi
