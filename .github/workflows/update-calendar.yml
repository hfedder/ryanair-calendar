name: Update Ryanair calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

concurrency:
  group: ryanair-calendar-update
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Ryanair calendar
        run: python update_ryanair_calendar.py
        env:
          PUBLISH_CALENDAR: "true"
          MONTHS_AHEAD: "12"

      - name: Validate calendar
        run: |
          test -s Ryanair_TRN_BGY_CPH_candidate.ics
          test -s ryanair_validation_report.json

          python - <<'PY'
          import json

          with open("ryanair_validation_report.json") as f:
              report = json.load(f)

          assert not report["errors"], report["errors"]
          assert report["total_flights"] > 0
          assert len(report["months"]) == 48
          assert all(m["ok"] for m in report["months"])

          print("Calendar validation passed")
          print("Total flights:", report["total_flights"])
          print("Routes:", report["counts"])
          PY

      - name: Commit calendar files
        run: |
          git config user.name "Ryanair Calendar Bot"
          git config user.email "actions@users.noreply.github.com"

          git add Ryanair_TRN_BGY_CPH_candidate.ics
          git add ryanair_validation_report.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Ryanair flight calendar"
            git push
          fi
