name: Test Piemonte Rail Fast 90 Days v2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build date-validated 90-day rail candidate
        run: python -u piemonte_rolling_rail_fast90_v2.py --days 90
      - name: Upload candidate and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piemonte-fast90-v2-test
          path: |
            piemonte_fast90_v2_validation.json
            Piemonte_tog_fast90_v2_candidate.ics
          if-no-files-found: warn
