name: Test Piemonte tog 2027

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build independent candidate calendar
        env:
          PUBLISH_RAIL: "false"
        run: python build_piemonte_tog_2027.py
      - name: Upload candidate and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piemonte-tog-2027-test
          path: |
            Piemonte_tog_2027_candidate.ics
            tog_2027_validation.json
          if-no-files-found: warn
